media:
  - name: images
    label: Website images
    input: public/images
    output: images
    extensions: [jpg, jpeg, png, webp, gif]
    rename: safe
  - name: documents
    label: Documents and PDFs
    input: public/uploads
    output: uploads
    categories: [document]
    rename: safe

components:
  programme-meta:
    type: object
    fields:
      - { name: pageTitle, label: Browser page title, type: string, required: true }
      - { name: description, label: Search description, type: text, required: true }
  programme-hero-note:
    type: object
    fields:
      - { name: label, label: Label, type: string, required: true }
      - { name: value, label: Main value, type: string, required: true }
      - { name: lines, label: Supporting lines, type: string, list: true }
  programme-facts:
    type: object
    list: { collapsible: { collapsed: true, summary: "{label}" } }
    fields:
      - { name: label, label: Label, type: string, required: true }
      - { name: value, label: Value, type: string, required: true }
  programme-overview:
    type: object
    fields:
      - { name: kicker, label: Short heading, type: string, required: true }
      - { name: title, label: Heading, type: string, required: true }
      - { name: paragraphs, label: Introductory paragraphs, type: text, list: true }
      - { name: requirements, label: Show as requirements, type: boolean }
      - { name: questions, label: Questions or requirements, type: string, list: true }
  programme-curriculum:
    type: object
    fields:
      - { name: kicker, label: Short heading, type: string, required: true }
      - { name: title, label: Heading, type: string, required: true }
      - { name: items, label: Topics, type: string, list: true }
  programme-progression:
    type: object
    fields:
      - { name: kicker, label: Short heading, type: string, required: true }
      - { name: title, label: Heading, type: string, required: true }
      - name: segments
        label: Text and links
        type: object
        list: { collapsible: { collapsed: true, summary: "{text}" } }
        fields:
          - { name: text, label: Text, type: text, required: true }
          - { name: href, label: Optional link, type: string }
  programme-enrol:
    type: object
    fields:
      - { name: kicker, label: Short heading, type: string, required: true }
      - { name: title, label: Heading, type: string, required: true }
      - name: poster
        label: Poster
        type: object
        fields:
          - { name: image, label: Image, type: image, required: true, options: { media: images } }
          - { name: href, label: Poster or document link, type: string, required: true }
          - { name: alt, label: Image description, type: string, required: true }
      - name: button
        label: Main button
        type: object
        fields:
          - { name: label, label: Button text, type: string, required: true }
          - { name: href, label: Button link, type: string, required: true }
      - { name: contactLabel, label: Contact heading, type: string, required: true }
      - name: contacts
        label: Contact links
        type: object
        list: { collapsible: { collapsed: true, summary: "{label}" } }
        fields:
          - { name: label, label: Display text, type: string, required: true }
          - { name: href, label: Link, type: string, required: true }
      - { name: location, label: Location and schedule lines, type: string, list: true }
      - { name: note, label: Note, type: text }
content:
  - name: site-settings-group
    label: Site settings
    type: group
    items:
      - name: site-settings
        label: Navigation, footer and social links
        type: file
        path: public/content/site.json
        format: json
        fields:
          - name: navigation
            label: Navigation
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{label}"
            fields:
              - name: label
                label: Menu label
                type: string
                required: true
              - name: href
                label: Page link
                type: string
                description: Leave blank when this menu contains dropdown items.
              - name: items
                label: Dropdown items
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: "{label}"
                fields:
                  - name: label
                    label: Item label
                    type: string
                    required: true
                  - name: href
                    label: Item link
                    type: string
                    required: true
          - name: footer
            label: Footer
            type: object
            fields:
              - name: copyright
                label: Copyright text
                type: string
                required: true
              - name: social
                label: Social links
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: "{label}"
                fields:
                  - name: label
                    label: Platform
                    type: string
                    required: true
                  - name: href
                    label: Link
                    type: string
                    required: true
                  - name: icon
                    label: Font Awesome icon name
                    type: string
                    required: true

  - name: programme-headers-group
    label: Programme headers
    type: group
    items:
      - name: programmes
        label: Programme page summaries
        type: file
        path: public/content/programmes.json
        format: json
        list: true
        fields:
          - name: page
            label: Page filename
            type: string
            required: true
          - name: language
            label: Page language
            type: string
            required: true
          - name: kicker
            label: Short heading
            type: string
            required: true
          - name: title
            label: Programme title
            type: string
            required: true
          - name: lead
            label: Introduction
            type: text
            required: true
          - name: primary
            label: Primary button
            type: object
            fields:
              - name: label
                label: Button text
                type: string
                required: true
              - name: href
                label: Button link
                type: string
                required: true
          - name: secondary
            label: Secondary button
            type: object
            fields:
              - name: label
                label: Button text
                type: string
                required: true
              - name: href
                label: Button link
                type: string
                required: true

