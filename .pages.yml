  - name: gallery-events-group
    label: Gallery and events
    type: group
    items:
      - name: gallery
        label: Gallery events
        type: file
        path: public/content/gallery.json
        format: json
        list: true
        fields:
          - name: title
            label: Event title
            type: string
            required: true
          - name: date
            label: Event date
            type: string
            description: Use a readable date such as 5 April 2026. Leave blank for archive entries without a date.
          - name: image
            label: Thumbnail
            type: image
            required: true
            options:
              media: images
          - name: href
            label: Album or event link
            type: string
            required: true
