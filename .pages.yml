media:
  - name: images
    label: Website images
    input: public/images
    output: images
    extensions: [jpg, jpeg, png, webp, gif]
    rename: safe
  - name: documents
    label: Documents and PDFs
    input: public/uploads
    output: uploads
    categories: [document]
    rename: safe

components:
  programme-meta:
    type: object
    fields:
      - { name: pageTitle, label: Browser page title, type: string, required: true }
      - { name: description, label: Search description, type: text, required: true }
  programme-hero-note:
    type: object
    fields:
      - { name: label, label: Label, type: string, required: true }
      - { name: value, label: Main value, type: string, required: true }
      - { name: lines, label: Supporting lines, type: string, list: true }
  programme-facts:
    type: object
    list: { collapsible: { collapsed: true, summary: "{label}" } }
    fields:
      - { name: label, label: Label, type: string, required: true }
      - { name: value, label: Value, type: string, required: true }
  programme-overview:
    type: object
    fields:
      - { name: kicker, label: Short heading, type: string, required: true }
      - { name: title, label: Heading, type: string, required: true }
      - { name: paragraphs, label: Introductory paragraphs, type: text, list: true }
      - { name: requirements, label: Show as requirements, type: boolean }
      - { name: questions, label: Questions or requirements, type: string, list: true }
  programme-curriculum:
    type: object
    fields:
      - { name: kicker, label: Short heading, type: string, required: true }
      - { name: title, label: Heading, type: string, required: true }
      - { name: items, label: Topics, type: string, list: true }
  programme-progression:
    type: object
    fields:
      - { name: kicker, label: Short heading, type: string, required: true }
      - { name: title, label: Heading, type: string, required: true }
      - name: segments
        label: Text and links
        type: object
        list: { collapsible: { collapsed: true, summary: "{text}" } }
        fields:
          - { name: text, label: Text, type: text, required: true }
          - { name: href, label: Optional link, type: string }
  programme-enrol:
    type: object
    fields:
      - { name: kicker, label: Short heading, type: string, required: true }
      - { name: title, label: Heading, type: string, required: true }
      - name: poster
        label: Poster
        type: object
        fields:
          - { name: image, label: Image, type: image, required: true, options: { media: images } }
          - { name: href, label: Poster or document link, type: string, required: true }
          - { name: alt, label: Image description, type: string, required: true }
      - name: button
        label: Main button
        type: object
        fields:
          - { name: label, label: Button text, type: string, required: true }
          - { name: href, label: Button link, type: string, required: true }
      - { name: contactLabel, label: Contact heading, type: string, required: true }
      - name: contacts
        label: Contact links
        type: object
        list: { collapsible: { collapsed: true, summary: "{label}" } }
        fields:
          - { name: label, label: Display text, type: string, required: true }
          - { name: href, label: Link, type: string, required: true }
      - { name: location, label: Location and schedule lines, type: string, list: true }
      - { name: note, label: Note, type: text }
content:
  - name: site-settings-group
    label: Site settings
    type: group
    items:
      - name: site-settings
        label: Navigation, footer and social links
        type: file
        path: public/content/site.json
        format: json
        fields:
          - name: navigation
            label: Navigation
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{label}"
            fields:
              - name: label
                label: Menu label
                type: string
                required: true
              - name: href
                label: Page link
                type: string
                description: Leave blank when this menu contains dropdown items.
              - name: items
                label: Dropdown items
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: "{label}"
                fields:
                  - name: label
                    label: Item label
                    type: string
                    required: true
                  - name: href
                    label: Item link
                    type: string
                    required: true
          - name: footer
            label: Footer
            type: object
            fields:
              - name: copyright
                label: Copyright text
                type: string
                required: true
              - name: social
                label: Social links
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: "{label}"
                fields:
                  - name: label
                    label: Platform
                    type: string
                    required: true
                  - name: href
                    label: Link
                    type: string
                    required: true
                  - name: icon
                    label: Font Awesome icon name
                    type: string
                    required: true

  - name: main-pages-group
    label: Main pages
    type: group
    items:
      - name: homepage
        label: Homepage
        type: file
        path: public/content/pages/index.json
        format: json
        fields:
          - { name: meta, component: programme-meta }
          - name: hero
            label: Main banner
            type: object
            fields:
              - { name: logo, label: Logo, type: image, required: true, options: { media: images } }
              - { name: logoAlt, label: Logo description, type: string, required: true }
              - { name: title, label: Main heading, type: string, required: true }
              - { name: lead, label: Supporting text, type: text, required: true }
              - name: primary
                label: Primary button
                type: object
                fields:
                  - { name: label, label: Button text, type: string, required: true }
                  - { name: href, label: Button link, type: string, required: true }
              - name: secondary
                label: Secondary button
                type: object
                fields:
                  - { name: label, label: Button text, type: string, required: true }
                  - { name: href, label: Button link, type: string, required: true }
          - name: pathways
            label: Featured study pathways
            type: object
            fields:
              - { name: kicker, label: Short heading, type: string, required: true }
              - { name: title, label: Section title, type: string, required: true }
              - name: allCourses
                label: All courses link
                type: object
                fields:
                  - { name: label, label: Link text, type: string, required: true }
                  - { name: href, label: Link, type: string, required: true }
              - name: items
                label: Pathways
                type: object
                list:
                  collapsible: { collapsed: true, summary: "{title}" }
                fields:
                  - { name: title, label: Title, type: string, required: true }
                  - { name: description, label: Description, type: text, required: true }
                  - { name: linkLabel, label: Link text, type: string, required: true }
                  - { name: href, label: Link, type: string, required: true }
          - name: about
            label: About preview
            type: object
            fields:
              - { name: image, label: Image, type: image, required: true, options: { media: images } }
              - { name: imageAlt, label: Image description, type: string, required: true }
              - { name: kicker, label: Short heading, type: string, required: true }
              - { name: title, label: Section title, type: string, required: true }
              - { name: description, label: Description, type: text, required: true }
              - name: button
                label: Button
                type: object
                fields:
                  - { name: label, label: Button text, type: string, required: true }
                  - { name: href, label: Button link, type: string, required: true }
          - name: latest
            label: Latest event section
            type: object
            fields:
              - { name: kicker, label: Short heading, type: string, required: true }
              - { name: title, label: Section title, type: string, required: true }
              - name: button
                label: Gallery button
                type: object
                fields:
                  - { name: label, label: Button text, type: string, required: true }
                  - { name: href, label: Button link, type: string, required: true }
          - name: contact
            label: Contact strip
            type: object
            fields:
              - { name: addressLabel, label: Address heading, type: string, required: true }
              - { name: address, label: Address, type: string, required: true }
              - { name: phoneLabel, label: Phone heading, type: string, required: true }
              - { name: phone, label: Displayed phone number, type: string, required: true }
              - { name: phoneHref, label: Phone link, type: string, required: true }
              - { name: emailLabel, label: Email heading, type: string, required: true }
              - name: emails
                label: Email addresses
                type: object
                list:
                  collapsible: { collapsed: false, summary: "{label}" }
                description: Add up to two email addresses for the homepage contact strip.
                fields:
                  - { name: label, label: Displayed email, type: string, required: true }
                  - { name: href, label: Email link, type: string, required: true, description: "Use mailto: followed by the email address." }
              - name: button
                label: Contact button
                type: object
                fields:
                  - { name: label, label: Button text, type: string, required: true }
                  - { name: href, label: Button link, type: string, required: true }

      - name: about-page
        label: About the College
        type: file
        path: public/content/pages/about.json
        format: json
        fields:
          - { name: meta, component: programme-meta }
          - name: hero
            label: Introduction
            type: object
            fields:
              - { name: kicker, label: Short heading, type: string, required: true }
              - { name: title, label: Main heading, type: string, required: true }
              - { name: lead, label: Supporting text, type: text, required: true }
              - { name: image, label: Main image, type: image, required: true, options: { media: images } }
              - { name: imageAlt, label: Image description, type: string, required: true }
          - name: story
            label: Our story
            type: object
            fields:
              - { name: kicker, label: Short heading, type: string, required: true }
              - { name: title, label: Section title, type: string, required: true }
              - { name: paragraphs, label: Paragraphs, type: text, list: true }
          - name: facts
            label: College facts
            type: object
            list:
              collapsible: { collapsed: true, summary: "{value}" }
            fields:
              - { name: value, label: Main text, type: string, required: true }
              - { name: label, label: Supporting text, type: string, required: true }
          - name: leadership
            label: Leadership
            type: object
            fields:
              - { name: kicker, label: Short heading, type: string, required: true }
              - { name: title, label: Section title, type: string, required: true }
              - name: people
                label: Principals
                type: object
                list:
                  collapsible: { collapsed: true, summary: "{role}: {name}" }
                fields:
                  - { name: role, label: Role, type: string, required: true }
                  - { name: name, label: Name, type: string, required: true }
                  - { name: qualification, label: Qualifications, type: string }
                  - { name: image, label: Portrait, type: image, required: true, options: { media: images } }
                  - { name: imageAlt, label: Image description, type: string, required: true }
          - name: gallery
            label: Closing photograph
            type: object
            fields:
              - { name: image, label: Photograph, type: image, required: true, options: { media: images } }
              - { name: imageAlt, label: Image description, type: string, required: true }
          - name: cta
            label: Closing call to action
            type: object
            fields:
              - { name: kicker, label: Short heading, type: string, required: true }
              - { name: title, label: Section title, type: string, required: true }
              - name: button
                label: Button
                type: object
                fields:
                  - { name: label, label: Button text, type: string, required: true }
                  - { name: href, label: Button link, type: string, required: true }

      - name: courses-page
        label: All Courses
        type: file
        path: public/content/pages/courses.json
        format: json
        fields:
          - name: meta
            component: programme-meta
          - name: hero
            label: Page introduction
            type: object
            fields:
              - { name: kicker, label: Short heading, type: string, required: true }
              - { name: title, label: Main heading, type: string, required: true }
              - { name: lead, label: Introduction, type: text, required: true }
          - name: start
            label: Starting recommendation
            type: object
            fields:
              - { name: kicker, label: Short heading, type: string, required: true }
              - { name: title, label: Heading, type: string, required: true }
              - { name: description, label: Description, type: text, required: true }
              - { name: label, label: Button text, type: string, required: true }
              - { name: href, label: Button link, type: string, required: true }
          - name: stages
            label: Study stages
            type: object
            list: { collapsible: { collapsed: true, summary: "{number} — {title}" } }
            fields:
              - { name: id, label: Section ID, type: string, required: true }
              - { name: number, label: Stage number, type: string, required: true }
              - { name: kicker, label: Short heading, type: string, required: true }
              - { name: title, label: Heading, type: string, required: true }
              - { name: image, label: Illustration, type: image, required: true, options: { media: images } }
              - { name: imageAlt, label: Image description, type: string, required: true }
              - name: programmes
                label: Programme cards
                type: object
                list: { collapsible: { collapsed: true, summary: "{page}" } }
                fields:
                  - { name: page, label: Programme page, type: string, required: true }
                  - { name: level, label: Language or level, type: string, required: true }
                  - { name: duration, label: Duration, type: string, required: true }
                  - { name: linkLabel, label: Link text, type: string, required: true }
          - name: comparison
            label: Comparison table
            type: object
            fields:
              - { name: kicker, label: Short heading, type: string, required: true }
              - { name: title, label: Heading, type: string, required: true }
              - { name: columns, label: Column headings, type: string, list: true }
              - name: rows
                label: Table rows
                type: object
                list: { collapsible: { collapsed: true, summary: "{programme}" } }
                fields:
                  - { name: programme, label: Programme, type: string, required: true }
                  - { name: duration, label: Duration, type: string, required: true }
                  - { name: suitableFor, label: Suitable for, type: string, required: true }
          - name: banner
            label: Programme banner
            type: object
            fields:
              - { name: image, label: Image, type: image, required: true, options: { media: images } }
              - { name: imageAlt, label: Image description, type: string, required: true }
          - name: guidance
            label: Contact prompt
            type: object
            fields:
              - { name: kicker, label: Short heading, type: string, required: true }
              - { name: title, label: Heading, type: string, required: true }
              - { name: label, label: Button text, type: string, required: true }
              - { name: href, label: Button link, type: string, required: true }

      - name: contact-page
        label: Contact
        type: file
        path: public/content/contact.json
        format: json
        fields:
          - { name: meta, component: programme-meta }
          - name: hero
            label: Page introduction
            type: object
            fields:
              - { name: kicker, label: Short heading, type: string, required: true }
              - { name: title, label: Main heading, type: string, required: true }
              - { name: description, label: Introduction, type: text, required: true }
          - name: form
            label: Contact form
            type: object
            fields:
              - { name: kicker, label: Short heading, type: string, required: true }
              - { name: title, label: Heading, type: string, required: true }
              - { name: action, label: FormSubmit address, type: string, required: true }
