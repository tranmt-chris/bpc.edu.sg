              - { name: address, label: Address, type: string, required: true }
              - { name: phoneLabel, label: Phone heading, type: string, required: true }
              - { name: phone, label: Displayed phone number, type: string, required: true }
              - { name: phoneHref, label: Phone link, type: string, required: true }
              - { name: emailLabel, label: Email heading, type: string, required: true }
              - name: emails
                label: Email addresses
