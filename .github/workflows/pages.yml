name: Deploy website preview

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generated-html-diff:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Check out proposed website
        uses: actions/checkout@v4
        with:
          path: proposed

      - name: Check out current main website
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate both versions of the website
        run: |
          (cd baseline && npm run build:content)
          (cd proposed && npm run build:content)

      - name: Compare generated cPanel deployment packages
        run: |
          touch baseline/dist/.nojekyll proposed/dist/.nojekyll
          if git diff --no-index --no-ext-diff --binary -- baseline/dist proposed/dist > generated-html.diff; then
            status=0
          else
            status=$?
          fi
          if [ $status -gt 1 ]; then exit $status; fi
          if [ ! -s generated-html.diff ]; then echo "No cPanel deployment-package changes." > generated-html.diff; fi

      - name: Save cPanel deployment-package comparison
        uses: actions/upload-artifact@v4
        with:
          name: generated-html-diff
          path: generated-html.diff
          if-no-files-found: error

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Download website source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build shared website content
        run: npm run build:content

      - name: Prepare website
        run: |
          touch dist/.nojekyll

      - name: Save cPanel deployment download
        uses: actions/upload-artifact@v4
        with:
          name: bpc-cpanel-deployment
          path: dist
          if-no-files-found: error

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
