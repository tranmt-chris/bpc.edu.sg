name: Deploy website preview

on:
  push:
    branches:
      - main
    paths-ignore:
      - public/js/site-data.js
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Download website source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build shared website content
        run: npm run build:content

      - name: Save generated website content
        run: |
          if git diff --quiet -- public/js/site-data.js public/*.html; then
            echo "Generated website content is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/js/site-data.js public/*.html
          git commit -m "Update generated website content and cache version"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Prepare website
        run: |
          touch public/.nojekyll

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
